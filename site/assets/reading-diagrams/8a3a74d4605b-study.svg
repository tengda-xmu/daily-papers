<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的反馈驱动剪枝示意</title><desc id="desc">仅概括云边反馈、多智能体决策与设备特定剪枝之间的关系，不表示论文原图或未报告的系统配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M250.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供决策反馈</text><path d="M630.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供决策反馈</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">生成剪枝策略</text><rect x="75.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">云端实时反馈</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要明确将云端反馈列为决策依据，未说明具体</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">反馈内容。</text><rect x="455.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">边缘实时反馈</text><text x="472.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要明确将边缘反馈列为决策依据，未说明具体</text><text x="472.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">反馈内容。</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">大语言模型多智能体决策中枢</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">依据云端与边缘的实时反馈生成剪枝策略。</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">设备特定剪枝策略</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">面向不同设备生成相应策略，支持自适应边缘模</text><text x="282.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">型压缩。</text></svg>