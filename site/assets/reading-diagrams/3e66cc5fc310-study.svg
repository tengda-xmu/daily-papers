<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的FamDLike框架与应用示意</title><desc id="desc">概括框架包含的建模组件及摘要列出的测试场景，不表示组件必须串行运行，也不表达定量性能。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含建模组件</text><path d="M440.0,218 V249.0 H440.00000000000006 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含建模组件</text><path d="M440.0,218 V249.0 H693.3333333333334 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含建模组件</text><path d="M328.3333333333333,140.0 H10 V576.0 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">FamDLike家族特异类</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">药性框架</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">面向靶标家族探索类药性化</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">学空间，各建模组件也可独</text><text x="345.3333333333333" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">立使用。</text><rect x="75.0" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">期望度函数</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要列出的互补建模方式之</text><text x="92.0" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">一。</text><rect x="328.33333333333337" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">广义加性模型</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要列出的互补建模方式之</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">一。</text><rect x="581.6666666666667" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">基于树的机器学习模</text><text x="598.6666666666667" y="333" font