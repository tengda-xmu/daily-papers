<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1044" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的加载方案优化关系</title><desc id="desc">概括工装复用约束、混合变量优化与全尺寸试验验证的关系，不代表论文原图或算法内部执行顺序。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1044" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">限定候选位置与质量下界</text><path d="M43.0,322.0 H21 V710.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,582 V613.0 H190.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">考虑动力学效应</text><path d="M190.0,776 V807.0 H190.0 V838" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="825.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">验证优化方案</text><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">静力试验工装条件</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">加载点作为候选安装位置，鞍座基础质</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">量作为对应质量变量下界。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">离散与连续变量</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">联合考虑设备安装位置、激振力幅值、</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">激振点鞍座质量和配重质量。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">挥舞方向动力学模型</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考虑预弯及几何非线性引起的刚度软化</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">效应。</text><rect x="43.0" y="644" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">加载方案优化</text><text x="60.0" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">采用贝叶斯优化与混合整数非线性规划</text><text x="60.0" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">，满足载荷保守包络要求。</text><rect x="43.0" y="838" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="838" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="867" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">全尺寸疲劳试验验证</text><text x="60.0" y="898" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过大型风机叶片试验验证优化方案，</text><text x="60.0" y="919" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">并报告挥舞与摆振方向的弯矩包络结果</text><text x="60.0" y="940" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text></svg>