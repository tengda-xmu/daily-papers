<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 850" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的方法比较与结论示意</title><desc id="desc">仅概括摘要明确的分析基础、比较对象与结论关系，不代表论文原图或具体模型实现流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="850" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">作为分析依据</text><path d="M190.0,388 V419.0 H190.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">归纳评估要素</text><path d="M43.0,322.0 H32 V710.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">文献与规范分析基础</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">同行评审出版物，以及IMO和DNV发布的</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">规范与技术文件。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">比较剩余寿命预测方法</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">断裂力学、疲劳寿命预测、有限元分析</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">、腐蚀预测、结构健康监测及人工智能</text><text x="60.0" y="358" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">方法。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">归纳可靠评估的共同要素</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">联合考虑实测结构状态、后续退化模型</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">、未来载荷和适用极限状态判据。</text><rect x="43.0" y="644" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">提出融合发展方向</text><text x="60.0" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">融合物理与概率模型、监测数据和计算</text><text x="60.0" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">预测工具；不是已验证的性能提升。</text></svg>