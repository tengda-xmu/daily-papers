<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的疲劳管理闭环组成</title><desc id="desc">示意综述明确整合的研究环节，不表示具体执行顺序、已部署系统或已验证效果；此图不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整合工艺选择</text><path d="M440.0,218 V249.0 H440.00000000000006 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整合寿命预测</text><path d="M440.0,218 V249.0 H693.3333333333334 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整合实验验证</text><path d="M328.3333333333333,140.0 H10 V576.0 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">仿真—感知—机器学习</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">闭环</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">面向焊接金属薄板，统一整</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">合工艺、预测、验证与监测</text><text x="345.3333333333333" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="75.0" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">焊接工艺选择</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">综述讨论不同焊接方法及其</text><text x="92.0" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">疲劳性能。</text><rect x="328.33333333333337" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳寿命预测</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">涵盖有限元、内聚区、晶体</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">塑性及多物理场／多尺度计</text><text x="345.33333333333337" y="382" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">算方法。</text><rect x="581.6666666666667" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">实验验证</text><text x="598.6666666666667" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为统一框架的组成环节，</text><text x="598.6666666666667" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">并涉及实验表征进展。</text><rect x="328.3333333333333" y="498" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="498" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="527" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">结构健康监测</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">讨论数字孪生与传感器融合</text><text x="345.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">对损伤检测和维护预测的作</text><text x="345.3333333333333" y="600" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用。</text></svg>