<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1214" role="img" aria-labelledby="title desc"><title id="title">研究建议：面向多背景可靠性的条件设计</title><desc id="desc">对应第一条路线，全部为拟议设计；以独立背景检验可靠性，不将预期收益写成实测结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="14">拟开展的验证路线</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">统一记录</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">条件学习</text><path d="M440.0,570 V601.0 H250.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">建议实验</text><path d="M440.0,570 V601.0 H630.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">公平对照</text><path d="M250.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">独立检验</text><path d="M630.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">分离贡献</text><path d="M440.0,950 V981.0 H440.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预注册判据</text><path d="M615.0,1076.0 H859 V506.0 H615.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">整理可用资料</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">公开序列和Source Data起步，申请原始检测数据</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">并补齐条件</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">定义条件化标签</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">区分检出概率、同肽滴度、伙伴身份及培养条件</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">条件代理与候选生成</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">联合邻域和条件输入，按不确定性及最差条件表</text><text x="282.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">现选候选</text><rect x="75.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="632" width="4" height="128" rx="2" fill="#0f766e"/><text x="92.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">多背景实验矩阵</text><text x="92.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建议24候选、两类伙伴、两种条件，各设三个培</text><text x="92.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">养重复</text><rect x="455.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="632" width="4" height="128" rx="2" fill="#0f766e"/><text x="472.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">基线与组件消融</text><text x="472.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">对照原流程和仅序列代理，消融伙伴、培养及不</text><text x="472.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">确定性信息</text><rect x="265.0" y="822" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="822" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">独立背景留出</text><text x="282.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">按序列家族及背景划分，避免近缘变体跨集合</text><rect x="265.0" y="1012" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="1012" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">检验可靠性收益</text><text x="282.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较功能检出率、滴度区间和最差条件表现；失</text><text x="282.0" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">败则专用化</text></svg>