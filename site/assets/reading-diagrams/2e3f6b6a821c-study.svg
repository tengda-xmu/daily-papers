<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 665" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的PITL信息融合示意</title><desc id="desc">仅展示摘要明确提及的信息来源及预测目标，不代表论文原图，也不表达具体网络结构或训练顺序。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="665" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,197 V228.0 H440.0 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">融入物理信息</text><path d="M440.00000000000006,197 V228.0 H440.0 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整合特征信息</text><path d="M693.3333333333334,197 V228.0 H440.0 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">多源学习与迁移</text><path d="M440.0,394 V425.0 H440.0 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测疲劳寿命</text><rect x="75.0" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理先验</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括等效效应变量模型、Man</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">son–Coffin模型等物理信息</text><text x="92.0" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">低周疲劳滞回环特征</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要明确纳入模型的信息之</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">一。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多源疲劳试验数据</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用已知疲劳加载条件下的</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">信息。</text><rect x="328.3333333333333" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">PITL预测模型</text><text x="345.3333333333333" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过模型架构整合物理信息</text><text x="345.3333333333333" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">与迁移学习。</text><rect x="328.3333333333333" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">不同应变比下的寿命</text><text x="345.3333333333333" y="509" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">预测</text><text x="345.3333333333333" y="540" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">预测目标为IN718高温合金的</text><text x="345.3333333333333" y="561" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">疲劳寿命。</text></svg>