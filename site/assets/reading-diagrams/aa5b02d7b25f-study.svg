<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的疲劳试验与多模型研究示意</title><desc id="desc">仅展示摘要明确给出的试验与模型比较关系；各模型为并列分析分支，不表示串联计算流程，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">试验结合模型比较</text><path d="M440.0,380 V411.0 H186.66666666666669 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">概率评估</text><path d="M440.0,380 V411.0 H440.00000000000006 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">小样本分析</text><path d="M440.0,380 V411.0 H693.3333333333334 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">智能预测</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">水工混凝土疲劳试验</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">在0.75、0.80和0.85应力水</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">平下开展试验</text><rect x="328.3333333333333" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">结合多模型比较</text><text x="345.3333333333333" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">组织概率评估、小样本分析</text><text x="345.3333333333333" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">与智能预测</text><rect x="75.0" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">Weibull概率模型</text><text x="92.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过P–S–N曲线量化寿命的应</text><text x="92.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">力敏感性</text><rect x="328.33333333333337" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">增强GM(1,1)模型</text><text x="345.33333333333337" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">引入动态时间加权与归一化</text><text x="345.33333