<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 850" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的任务导向综述框架</title><desc id="desc">展示摘要明确的任务组织与方法比较关系，不表示实验流程，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="850" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">按任务组织</text><path d="M43.0,128.0 H21 V516.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,582 V613.0 H190.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">从这些维度比较</text><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习赋能无线电能传输</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建立任务导向的综述框架。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相互关联的任务领域</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结构设计与优化、参数与状态估计、控</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">制与优化。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">纳入比较的学习方法</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">监督学习、强化学习、混合或物理信息</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">方法。</text><rect x="43.0" y="644" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多维度比较</text><text x="60.0" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">数据需求、物理模型依赖、信息来源、</text><text x="60.0" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">计算需求、精度、在线响应、适用范围</text><text x="60.0" y="746" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">与优化目标。</text></svg>