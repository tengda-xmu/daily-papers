<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 834" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的模型比较流程</title><desc id="desc">仅概括摘要明确陈述的数据处理、模型训练与评价关系，不是论文原图，不表达未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="834" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">检查后预处理</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预处理后训练</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">训练后评价</text><rect x="235.0" y="62" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AI4I 2020合成数据</text><text x="252.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">初步检查显示结构清晰、有序，但故障类别占比低。</text><rect x="235.0" y="252" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">数据预处理</text><text x="252.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要说明进行了预处理，未展开具体操作。</text><rect x="235.0" y="442" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">模型训练</text><text x="252.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">训练逻辑回归、决策树、随机森林和多层感知机。</text><rect x="235.0" y="632" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">同一测试集评价</text><text x="252.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较模型表现，随机森林与多层感知机在不同指标上领先</text><text x="252.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text></svg>