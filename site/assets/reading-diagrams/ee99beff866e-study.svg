<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 656" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述分析结构</title><desc id="desc">概括文献分析与三个技术维度的关系，不表示技术执行顺序，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="656" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">系统分析</text><path d="M440.0,388 V419.0 H186.66666666666669 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">技术维度</text><path d="M440.0,388 V419.0 H440.00000000000006 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">技术维度</text><path d="M440.0,388 V419.0 H693.3333333333334 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">技术维度</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">核心研究文献</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">2016至2026年发表的103篇核</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">心研究论文。</text><rect x="328.3333333333333" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">系统分析与分类</text><text x="345.3333333333333" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">提出分层CDM分类体系，并从</text><text x="345.3333333333333" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">三个核心技术维度梳理研究</text><text x="345.3333333333333" y="358" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="75.0" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="92.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">数据增强</text><text x="92.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">生成高保真故障样本与退化</text><text x="92.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">模式，缓解数据稀缺和类别</text><text x="92.0" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">不平衡。</text><rect x="328.33333333333337" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="345.33333333333337" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">模型适配</text><text x="345.33333333333337" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使通用预训练大语言模型适</text><text x="345.33333333333337" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">应特定设备与复杂工业环境</text><text x="345.33333333333337" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="581.6666666666667" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="598.6666666666667" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">知识推理与决策</text><text x="598.6666666666667" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">整合外部工业知识、自主推</text><text x="598.6666666666667" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">理机制和维护决策过程。</text></svg>