<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1164" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的来流表示与模型比较示意</title><desc id="desc">概括时间聚合来流数据到输入表示、模型配置及预测目标的关系；这是摘要整理示意，不是论文原图，也不补充未报告的实验细节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1164" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">空间平均</text><path d="M440.0,218 V249.0 H440.00000000000006 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">保留全网格</text><path d="M440.0,218 V249.0 H693.3333333333334 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">主成分压缩</text><path d="M328.3333333333333,140.0 H10 V576.0 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M75.0,358.0 H21 V794.0 H201.66666666666666" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M328.33333333333337,358.0 H32 V794.0 H201.66666666666666" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end=