h="4" height="135" rx="2" fill="#153e64"/><text x="218.66666666666666" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相同 SimpleMLP 架构</text><text x="218.66666666666666" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">对三种输入进行 5 折 Group</text><text x="218.66666666666666" y="734" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">KFold 交叉验证比较</text><rect x="455.0" y="653" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="472.0" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拓扑感知 CNN 配置</text><text x="472.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">二维表示搭配卷积神经网络</text><text x="472.0" y="734" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">，单独评估</text><rect x="328.3333333333333" y="850" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="850" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="879" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">电功率与疲劳载荷预</text><text x="345.3333333333333" y="903" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">测</text><text x="345.3333333333333" y="934" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较不同预测目标下的误差</text><text x="345.3333333333333" y="955" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">表现</text></svg>