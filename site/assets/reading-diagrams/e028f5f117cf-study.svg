.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="201.66666666666666" y="716" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="201.66666666666666" y="716" width="4" height="156" rx="2" fill="#153e64"/><text x="218.66666666666666" y="745" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相同 SimpleMLP</text><text x="218.66666666666666" y="776" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较基线、展平与 PCA 输入</text><text x="218.66666666666666" y="797" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">，采用 5 折 GroupKFold 交</text><text x="218.66666666666666" y="818" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">叉验证。</text><rect x="455.0" y="716" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="716" width="4" height="156" rx="2" fill="#153e64"/><text x="472.0" y="745" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拓扑感知 CNN</text><text x="472.0" y="776" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">单独评估二维空间输入与卷</text><text x="472.0" y="797" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">积神经网络的组合配置。</text><rect x="328.3333333333333" y="934" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="934" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="963" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">电功率与疲劳载荷预</text><text x="345.3333333333333" y="987" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">测</text><text x="345.3333333333333" y="1018" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较不同预测目标下，输入</text><text x="345.3333333333333" y="1039" font-family=