<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 834" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的特征处理与集成学习关系</title><desc id="desc">仅概括摘要明确陈述的方法关系，不表示完整训练流程、具体实验配置或论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="834" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H250.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">特征用于分类</text><path d="M250.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">评价与优化相结合</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">确定成员与权重</text><path d="M440.0,190 V221.0 H630.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">筛选输入特征</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">I–V特性提取特征</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用曼哈顿距离和切比雪夫距离提取代表性特征</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="75.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">模糊逻辑评价分类器</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评价依据为平均准确率、F1分数和标准差。</text><rect x="455.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">置换特征选择</text><text x="472.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">降低输入维度，以提高计算效率；摘要未交代其</text><text x="472.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">具体执行顺序。</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">粒子群优化</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">确定分类器子集及对应的集成权重。</text><rect x="265.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">加权集成故障分类</text><text x="282.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">组合所选分类器，用于光伏阵列故障检测与分类</text><text x="282.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text></svg>