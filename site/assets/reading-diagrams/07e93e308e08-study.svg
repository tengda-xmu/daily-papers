<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 850" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的光伏故障诊断框架</title><desc id="desc">概括摘要明确的方法关系；分支不表示完整执行顺序，也不表达未报告的实验配置。这不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="850" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提取代表性特征</text><path d="M440.0,388 V419.0 H186.66666666666669 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于分类器学习</text><path d="M186.66666666666669,582 V613.0 H440.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供分类器评价</text><path d="M440.00000000000006,582 V613.0 H440.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">确定子集与权重</text><path d="M440.0,388 V419.0 H693.3333333333334 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">对输入特征降维</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">光伏I–V特性</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以光伏阵列的电流—电压特性</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为特征提取来源。</text><rect x="328.3333333333333" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">距离度量提取特征</text><text x="345.3333333333333" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">采用曼哈顿距离和切比雪夫</text><text x="345.3333333333333" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">距离提取代表性特征。</text><rect x="75.0" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="92.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">模糊逻辑评价分类器</text><text x="92.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评价依据为平均准确率、F1</text><text x="92.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">分数和标准差。</text><rect x="328.33333333333337" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="345.33333333333337" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">粒子群优化</text><text x="345.33333333333337" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">确定分类器子集及其集成权</text><text x="345.33333333333337" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">重。</text><rect x="581.6666666666667" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="598.6666666666667" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">置换特征选择</text><text x="598.6666666666667" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用于降低输入维度、提高计</text><text x="598.6666666666667" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">算效率；摘要未明确其执行</text><text x="598.6666666666667" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">位置。</text><rect x="328.3333333333333" y="644" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">优化加权集成</text><text x="345.3333333333333" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用于光伏阵列故障检测与分</text><text x="345.3333333333333" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">类。</text></svg>