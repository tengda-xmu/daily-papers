rosoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">Sr–Sn窗口实物验证</text><text x="252.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">主要组x=0、0.01、0.02，独立试件数未报告</text><rect x="235.0" y="1012" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">介电达标与局域证据</text><text x="252.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">两掺Sn组达标；多尺度观测支持极性异质性解释</text></svg>