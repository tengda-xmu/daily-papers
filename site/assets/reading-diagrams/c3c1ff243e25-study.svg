<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1024" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的UHPC疲劳寿命建模示意</title><desc id="desc">概括摘要明确描述的数据处理、算法评价与解释环节，不表示论文完整实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1024" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">偏态修正</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于预测建模</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较与优化</text><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">解释预测贡献</text><rect x="235.0" y="62" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">UHPC疲劳寿命数据</text><text x="252.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要指出数据存在显著正偏态。</text><rect x="235.0" y="252" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">Yeo–Johnson变换</text><text x="252.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">修正疲劳寿命数据的正偏态。</text><rect x="235.0" y="442" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习算法评价</text><text x="252.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">系统比较算法表现，并进行GPR超参数优化。</text><rect x="235.0" y="632" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">GPR预测模型</text><text x="252.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要报告其综合表现最佳，并开展源数据验证。</text><rect x="235.0" y="822" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">SHAP解释分析</text><text x="252.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">识别模型预测中的主导影响因素。</text></svg>