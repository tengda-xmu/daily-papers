<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1214" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的腐蚀疲劳评估过程</title><desc id="desc">仅概括摘要明确描述的方法关系；这是依据摘要整理的示意图，不是论文原图，也不表示具体计算配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">据此计算</text><path d="M190.0,380 V411.0 H190.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">纳入模型</text><path d="M190.0,570 V601.0 H190.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">结果比较</text><path d="M43.0,506.0 H10 V886.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,760 V791.0 H190.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较所需的分解</text><path d="M190.0,950 V981.0 H190.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">支持重新评估</text><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">实测位移</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为疲劳寿命计算的依据。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳寿命计算</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">根据实测位移计算，并纳入后续腐蚀模</text><text x="60.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">型。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">考虑几何损失的腐蚀模型</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">描述未来局部截面损失的分布。</text><rect x="43.0" y="632" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">腐蚀修正的 S–N 曲线路径</text><text x="60.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">其结果与腐蚀模型路径的结果进行比较</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="43.0" y="822" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">应力放大与缺口效应分解</text><text x="60.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">为两条路径的比较建立分解，并确定时</text><text x="60.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">变缺口系数。</text><rect x="43.0" y="1012" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">贝叶斯推断与 FORM</text><text x="60.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">在上述工作基础上，重新评估桥梁服役</text><text x="60.0" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">期内的可靠性。</text></svg>