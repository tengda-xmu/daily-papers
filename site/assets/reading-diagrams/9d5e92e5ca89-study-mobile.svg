<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1453" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的裂纹预测建模过程</title><desc id="desc">仅概括摘要明确陈述的材料标定、空间性能描述与裂纹预测关系，不代表论文原图，也不表示计算加速方法已与该流程完成集成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1453" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M43.0,129.5 H10 V523.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,326.5 H21 V720.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,523.5 H32 V917.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,788 V819.0 H190.0 V850" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="837.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">确定空间变化</text><path d="M43.0,917.5 H21 V1311.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,1182 V1213.0 H190.0 V1244" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="1231.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">判断裂纹萌生</text><rect x="43.0" y="62" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">不同材料状态的类铁路载荷实</text><text x="60.0" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">验</text><text x="60.0" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">材料状态对应轨头不同深度，用于标定</text><text x="60.0" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">各向异性材料模型。</text><rect x="43.0" y="259" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">现场样品测量</text><text x="60.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">据此重建累积剪切应变分布。</text><rect x="43.0" y="456" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">各向异性材料模型参数</text><text x="60.0" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过实验标定获得，用于描述轨头空间</text><text x="60.0" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">变化的材料性能。</text><rect x="43.0" y="653" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">累积剪切应变分布</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用于确定轨头材料性能的空间变化。</text><rect x="43.0" y="850" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="850" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="879" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">空间变化的材料性能</text><text x="60.0" y="910" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将已识别参数与重建的应变分布用于轨</text><text x="60.0" y="931" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">头材料描述。</text><rect x="43.0" y="1047" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1047" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="1076" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">改进裂纹萌生判据</text><text x="60.0" y="1107" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考虑累积塑性变形的影响。</text><rect x="43.0" y="1244" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1244" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="1273" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">混合交通载荷下的裂纹萌生预</text><text x="60.0" y="1297" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">测</text><text x="60.0" y="1328" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">框架关注高度变形表层与钢轨轮廓几何</text><text x="60.0" y="1349" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">变化的影响。</text></svg>