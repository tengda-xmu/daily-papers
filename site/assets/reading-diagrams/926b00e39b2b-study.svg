<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的拟议预测框架</title><desc id="desc">仅展示摘要明确提出的方法关系，不表示框架已完成验证，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">迁移已学模型</text><path d="M440.00000000000006,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供学习信息</text><path d="M693.3333333333334,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于构建框架</text><path d="M440.0,436 V467.0 H440.0 V498" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">目标为预测寿命</text><rect x="75.0" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相关任务中学到的模</text><text x="92.0" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">型</text><text x="92.0" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">迁移学习所利用的模型来源</text><text x="92.0" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">；摘要未说明具体相关任务</text><text x="92.0" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">表面粗糙度数据</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">拟议框架从中学习的信息。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳试验数据</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要明确提出用于构建框架</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">的数据。</text><rect x="328.3333333333333" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拟构建的迁移学习框</text><text x="345.3333333333333" y="333" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">架</text><text x="345.3333333333333" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合迁移学习与疲劳试验数</text><text x="345.3333333333333" y="385" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">据，学习粗糙度相关信息。</text><rect x="328.3333333333333" y="498" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="498" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="527" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳寿命预测</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">框架的目标输出，摘要未报</text><text x="345.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">告预测性能。</text></svg>