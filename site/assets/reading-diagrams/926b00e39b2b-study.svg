<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的迁移学习框架示意</title><desc id="desc">概括摘要提出的输入、迁移学习思路与预测目标；不是论文原图，也不表示框架已经完成验证。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">利用相关任务模型</text><path d="M440.00000000000006,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">从粗糙度数据学习</text><path d="M693.3333333333334,218 V249.0 H440.0 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">结合疲劳试验数据</text><path d="M440.0,436 V467.0 H440.0 V498" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">旨在预测</text><rect x="75.0" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相关任务中学到的模</text><text x="92.0" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">型</text><text x="92.0" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要对迁移学习的说明涉及</text><text x="92.0" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用相关任务已有模型，未</text><text x="92.0" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">指定具体源任务。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">表面粗糙度数据</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">拟议框架从中学习，用于疲</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">劳寿命预测。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳试验数据</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要提出结合这类数据构建</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">框架，未报告数据规模。</text><rect x="328.3333333333333" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拟构建迁移学习框架</text><text x="345.3333333333333" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用迁移学习开展小数据条</text><text x="345.3333333333333" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">件下的疲劳寿命建模。</text><rect x="328.3333333333333" y="498" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="498" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="527" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳寿命预测目标</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">属于摘要明确提出的目标，</text><text x="345.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要未给出预测性能结果。</text></svg>