<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 656" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的迁移学习框架思路</title><desc id="desc">概括摘要明确提出的信息关系，不代表论文原图、具体实现或已验证结果；相关任务模型来自摘要对迁移学习的一般说明。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="656" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">利用相关任务模型</text><path d="M440.00000000000006,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">从粗糙度数据学习</text><path d="M693.3333333333334,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">结合试验数据</text><path d="M440.0,388 V419.0 H440.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">拟实现</text><rect x="75.0" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">相关任务所学模型</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">迁移学习所利用的已有模型</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">，摘要未说明具体来源。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">表面粗糙度数据</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">拟议框架从中学习的表面信</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">息，具体表征方式未交代。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳试验数据</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要提出结合使用的数据，</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">样本规模与试验条件未交代</text><text x="598.6666666666667" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.3333333333333" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拟议迁移学习框架</text><text x="345.3333333333333" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">面向疲劳数据稀缺问题，具</text><text x="345.3333333333333" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">体迁移与训练方式未交代。</text><rect x="328.3333333333333" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳寿命预测</text><text x="345.3333333333333" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">框架拟实现的目标，摘要未</text><text x="345.3333333333333" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">报告预测性能。</text></svg>