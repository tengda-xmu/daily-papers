<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 656" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的TinyML采用思路</title><desc id="desc">概括摘要中预测性维护采用TinyML及其安全约束的关系，不代表论文实验流程或已经验证的部署效果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="656" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">采用轻量化思路应对</text><path d="M190.0,388 V419.0 H190.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">仍需考虑安全风险</text><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">预测性维护的部署约束</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">机器学习应用面临较大计算需求，以及</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">对较慢、成本效益不佳的云服务的依赖</text><text x="60.0" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">采用适合边缘计算的TinyML</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要提出以轻量化机器学习回应计算资</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">源与云服务依赖问题。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">同时面对数据安全约束</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">有限内存与处理能力限制安全机制适用</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">性，设备易被物理接触也增加风险。</text></svg>