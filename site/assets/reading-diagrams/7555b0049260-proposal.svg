<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1214" role="img" aria-labelledby="title desc"><title id="title">建议路线：以重复观测检验纵向孪生可靠性</title><desc id="desc">对应第一条研究路线，所有新增监督、分组和判据均为建议设计，不表示已取得改善。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="14">拟开展的验证路线</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整理真实观测</text><path d="M440.0,380 V411.0 H250.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">建议训练组</text><path d="M440.0,380 V411.0 H630.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">统一评估划分</text><path d="M250.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">条件重复生成</text><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">误差与校准</text><path d="M455.0,506.0 H32 V886.0 H265.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M440.0,950 V981.0 H440.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">确定证据边界</text><path d="M615.0,886.0 H859 V506.0 H425.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">申请重复影像资料</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">获取获授权的病史与重复影像，核查可用人数</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">受试者与时间隔离</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">隔离个体并留后验证，审计预训练数据重叠</text><rect x="75.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="92.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">纵向变化监督</text><text x="92.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">只监督真实观测间变化，保持SPD解码</text><rect x="455.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="472.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">基线与组件消融</text><text x="472.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较原DiffDT、病史AR、真实影像及条件图VAE</text><rect x="265.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="632" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">重复采样与校准</text><text x="282.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">估计生成不确定性，检查疾病概率校准</text><rect x="265.0" y="822" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="822" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">纵向可靠性判据</text><text x="282.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">同时评价变化误差、网络保真与稀有疾病召回</text><rect x="265.0" y="1012" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="1012" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">限定使用范围</text><text x="282.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">收益不足时退回横断面生成并明确适用边界</text></svg>