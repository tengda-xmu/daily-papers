<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 454" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的MPINN-ERL组成关系</title><desc id="desc">概括样本增强、诊断模型与正则化权重调节的关系，不表示论文的具体训练顺序或实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="454" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M250.0,190 V221.0 H250.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供故障样本增强</text><path d="M805.0,316.0 H859 V316.0 H425.0" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M630.0,190 V221.0 H630.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">动态调整正则化权重</text><rect x="75.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">条件通道—空间Wasserstein GAN</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">生成增强故障样本，用于缓解样本不足问题。</text><rect x="455.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">损失函数与增强强化学习</text><text x="472.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">动态调整物理启发动态残差正则化的权重。</text><rect x="75.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多尺度卷积与双向门控循环单元</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">构成研究所提出诊断模型的组成部分。</text><rect x="455.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理启发动态残差正则化</text><text x="472.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过残差正则化模块融入诊断系统。</text></svg>