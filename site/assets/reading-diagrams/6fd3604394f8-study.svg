<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的诊断整合评估示意</title><desc id="desc">概括外部诊断信息进入模型整合层后，与更强独立信息源进行比较的评估关系；不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H250.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供外部信息</text><path d="M250.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">整合输出</text><path d="M630.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">独立来源基准</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">外部诊断信息</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">研究考察模型能否可靠利用外部诊断信息。</text><rect x="75.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">大语言模型隐式整合</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">观察整合后的诊断输出，而非仅评价信息源本身</text><text x="92.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="455.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">更强的独立信息源</text><text x="472.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为直接比较中的独立来源基准。</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">比较诊断表现</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">检验整合是否相对更强独立来源具有一致优势。</text></svg>