<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 454" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的领域状态耦合关系</title><desc id="desc">概括摘要提出的动态演化、跨领域联系与拓扑约束关系，不表示已完成的系统部署，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="454" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">描述状态演化</text><path d="M440.00000000000006,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">连接不同领域状态</text><path d="M693.3333333333334,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供结构约束</text><rect x="75.0" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">动态算子</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">描述各领域状态的动态演化</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">跨领域交互矩阵</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建立不同领域状态之间的联</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">系。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拓扑特征</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为具有尺度稳健性的结构</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">约束。</text><rect x="328.3333333333333" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">各领域状态</text><text x="345.3333333333333" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">耦合数学表述中的领域状态</text><text x="345.3333333333333" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text></svg>