<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的系统综述框架</title><desc id="desc">仅概括摘要明确陈述的文献整理维度与研究缺口，不表示论文原图或具体实验流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="510" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">综合方法</text><path d="M440.0,218 V249.0 H440.00000000000006 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">分类研究</text><path d="M440.0,218 V249.0 H693.3333333333334 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">识别缺口</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">PRISMA指导的系统综</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">述</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">整理人工智能与机器学习预</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">测金属增材制造疲劳的同行</text><text x="345.3333333333333" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评议文献。</text><rect x="75.0" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">综合建模方法</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">覆盖传统浅层学习、卷积神</text><text x="92.0" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">经网络和物理信息神经网络</text><text x="92.0" y="382" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.33333333333337" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">按输入数据分类</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">区分缺陷敏感模型、微观组</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">织感知模型及混合代理模型</text><text x="345.33333333333337" y="382" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="581.6666666666667" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">识别可靠预测的研究</text><text x="598.6666666666667" y="333" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">缺口</text><text x="598.6666666666667" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">关注数据集标准化、物理融</text><text x="598.6666666666667" y="385" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">合、不确定性量化与跨材料</text><text x="598.6666666666667" y="406" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">泛化。</text></svg>