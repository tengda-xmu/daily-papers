<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1044" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的框架组成示意</title><desc id="desc">并列呈现摘要明确介绍的框架组成，不表示模块间的先后顺序或输入输出关系；此图不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1044" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">构建与引入</text><path d="M43.0,128.0 H21 V516.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,128.0 H32 V710.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,128.0 H10 V904.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">线性拓扑感知对齐框架</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合空间拓扑与大语言模型推理，面向</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">带式输送机维护知识图谱。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">本体与空间锚点</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">构建Physical–Space–Fault–Rule本体，</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以归一化线性拓扑映射赋予部件唯一空</text><text x="60.0" y="358" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">间锚点。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">CCAS抽取机制</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">从含噪、口语化维护日志中重建隐含故</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">障因果链与空间信息。</text><rect x="43.0" y="644" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">LTA-Alignment对齐</text><text x="60.0" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合高斯拓扑惩罚与大语言模型灰区仲</text><text x="60.0" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">裁，防止异地相似部件错误合并。</text><rect x="43.0" y="838" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="838" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="867" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">金标准标注协议</text><text x="60.0" y="898" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用维护日志、BOM记录、空间锚点和闭</text><text x="60.0" y="919" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">环维修证据建立结构化标注协议。</text></svg>