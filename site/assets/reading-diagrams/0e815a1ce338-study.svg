<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1214" role="img" aria-labelledby="title desc"><title id="title">原研究：物理特征集成与分对象验证</title><desc id="desc">Stacking用于集成预测；规范与SWT-LEFM对照连接PI-XGBoost，SHAP连接实际解释的RF和XGBoost。敏感性分析的具体模型未明确。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供基础参数</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">扩展输入</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">独立训练调优</text><path d="M440.0,760 V791.0 H186.66666666666669 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">PI折外预测</text><path d="M440.0,760 V791.0 H440.00000000000006 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">PI-XGBoost对照</text><path d="M440.0,760 V791.0 H693.3333333333334 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">选定模型解释</text><path d="M328.3333333333333,316.0 H10 V1076.0 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">文献推出疲劳数据</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">305个试件，统计独立性及重</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">复记录处理未报告</text><rect x="328.3333333333333" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">LEFM特征构造</text><text x="345.3333333333333" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">10个基础输入增加log10(NLE</text><text x="345.3333333333333" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">FM)，采用裂纹扩展假设</text><rect x="328.3333333333333" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">划分与训练准备</text><text x="345.3333333333333" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">随机8:2、种子4，标准化及</text><text x="345.3333333333333" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">训练集内调参</text><rect x="328.3333333333333" y="632" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">G与PI基础模型</text><text x="345.3333333333333" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">RF、SVR、GBR、XGBoost分别</text><text x="345.3333333333333" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">训练并比较</text><rect x="75.0" y="822" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">PI-Stacking</text><text x="92.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">四个PI基学习器折外预测，L</text><text x="92.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">asso元模型集成</text><rect x="328.33333333333337" y="822" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理与规范对照</text><text x="345.33333333333337" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">PI-XGBoost对照SWT-LEFM及</text><text x="345.33333333333337" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">规范；同集可比性有限</text><rect x="581.6666666666667" y="822" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">RF与XGBoost解释</text><text x="598.6666666666667" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">SHAP分析G/PI版本，解释贡</text><text x="598.6666666666667" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">献而非因果效应</text><rect x="328.3333333333333" y="1012" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">全局敏感性</text><text x="345.3333333333333" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">Morris与Sobol采样分析，具</text><text x="345.3333333333333" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">体被分析模型未明确</text></svg>