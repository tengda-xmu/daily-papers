<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1024" role="img" aria-labelledby="title desc"><title id="title">拟议路线：分型风险与跨任务校准</title><desc id="desc">对应第一条研究建议；样本规模、分组及成功判据均为建议设计，不表示已完成实验。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1024" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="14">拟开展的验证路线</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">按划分生成</text><path d="M440.0,380 V411.0 H250.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提取诊断分量</text><path d="M440.0,380 V411.0 H630.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">盲评行为错误</text><path d="M250.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">冻结风险映射</text><path d="M630.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供独立标签</text><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">检验增益与迁移</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">去重问题与独立划分</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建议1,200题，校准、开发、测试按问题划分，生</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">成变体不算独立问题。</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">多模型多解码生成</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建议三个开放模型、两种解码设置，记录内部信</text><text x="282.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">号及首次失败时刻。</text><rect x="75.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="92.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">FI任务条件校准</text><text x="92.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">仅在校准与开发集确定分量映射和阈值，随后冻</text><text x="92.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结。</text><rect x="455.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="472.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">独立错误类型标注</text><text x="472.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">分别标注重复、事实错误与指令违背，不用熵直</text><text x="472.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">接定义全部标签。</text><rect x="265.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="632" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">互补检测与消融</text><text x="282.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较FI、单组件和事实检测器，移除校准或核验</text><text x="282.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以测互补增益。</text><rect x="265.0" y="822" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="822" width="4" height="128" rx="2" fill="#0f766e"/><text x="282.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">锁定测试与迁移评估</text><text x="282.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评估同误报率召回、预警领先量、校准及开销，</text><text x="282.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">按问题聚类统计。</text></svg>