<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的固有频率与寿命低谷关联示意</title><desc id="desc">仅概括摘要明确陈述的耦合载荷、固有频率计算及寿命低谷对应关系，不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">在耦合载荷下计算</text><path d="M190.0,380 V411.0 H190.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">关联寿命极小值</text><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拉伸—扭转耦合载荷</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">研究对象为单壁MoS2纳米管。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">计算耦合载荷下的固有频率</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作者建立了拉伸与扭转共同作用下的固</text><text x="60.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">有频率计算方法。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">对应低中频寿命低谷</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">两个极小值分别对应拉伸固有频率及其</text><text x="60.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">第一谐波。</text></svg>