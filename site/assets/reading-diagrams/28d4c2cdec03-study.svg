<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 454" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的多中心比较示意</title><desc id="desc">概括两类模型接受内部与外部验证的关系，不表示模型训练流程，也不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="454" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H250.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较内部表现</text><path d="M440.0,190 V221.0 H630.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较外部表现</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AAD-Agent与ML集成模型</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">在回顾性、多中心研究中进行比较。</text><rect x="75.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">内部验证</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用中国3家医院的869名疑似患者。</text><rect x="455.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">外部验证</text><text x="472.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用另外2家医院的200名疑似患者。</text></svg>