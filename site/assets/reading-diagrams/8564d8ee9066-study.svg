<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的诊断方法示意</title><desc id="desc">概括物理先验、信号特征融合与双贝叶斯推断的关系，不代表论文原图，也不补充摘要未说明的训练配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H250.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">构建属性空间</text><path d="M250.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">引入物理先验</text><path d="M630.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">融合故障特征</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">拓扑与故障模式的物理关系</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">分析Vienna整流器拓扑与故障模式之间的物理关</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">系。</text><rect x="75.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">具有物理意义的故障属性空间</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">由物理关系构建故障属性空间，为诊断引入先验</text><text x="92.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">知识。</text><rect x="455.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多头注意力融合电流特征</text><text x="472.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">动态融合来自三相电流信号的多域故障特征。</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">双贝叶斯零样本故障诊断</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合朴素贝叶斯与集成多高斯贝叶斯算法，识别</text><text x="282.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">难以获取数据的开路故障。</text></svg>