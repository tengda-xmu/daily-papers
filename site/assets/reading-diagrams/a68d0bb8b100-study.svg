<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 656" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的材料换能关系示意</title><desc id="desc">概括摘要明确描述的结构响应经架构超材料转化为不同物理域信息的关系，不代表具体实验装置或已验证性能。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="656" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,194 V225.0 H440.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">结构响应转为信息</text><path d="M440.0,388 V419.0 H186.66666666666669 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">视觉信息途径</text><path d="M440.0,388 V419.0 H440.00000000000006 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">电磁信息途径</text><path d="M440.0,388 V419.0 H693.3333333333334 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">波信息途径</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">结构响应</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为材料参与感知与信息转</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">换的输入。</text><rect x="328.3333333333333" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">架构超材料换能</text><text x="345.3333333333333" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过经过设计的结构架构，</text><text x="345.3333333333333" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">编码并转换结构信息。</text><rect x="75.0" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="92.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">视觉信息</text><text x="92.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括形状变换、结构色、力</text><text x="92.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">致变色与力致发光。</text><rect x="328.33333333333337" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="345.33333333333337" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">电磁信息</text><text x="345.33333333333337" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括电学、电容、压电、摩</text><text x="345.33333333333337" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">擦电、射频、超表面及无源</text><text x="345.33333333333337" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">无线响应。</text><rect x="581.6666666666667" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="598.6666666666667" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">波信息</text><text x="598.6666666666667" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括弹性波传播、带隙、共</text><text x="598.6666666666667" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">振偏移、模式转换、局域化</text><text x="598.6666666666667" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">及机械滤波。</text></svg>