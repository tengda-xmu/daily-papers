<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1024" role="img" aria-labelledby="title desc"><title id="title">社论如何划分推理文本与监控证据</title><desc id="desc">图示概括社论的论证结构：SoT提供理解视角，两类转述证据共同指向可监控性仍需验证，而非展示已实现的监控系统。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1024" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">重新理解</text><path d="M265.0,316.0 H21 V696.0 H265.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M250.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提示误用风险</text><path d="M630.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提示文本脱耦</text><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">形成研究议程</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生成中间推理文本</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">CoT在最终回答前生成若干中间步骤。</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">状态载体视角</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">SoT将token视为承载计算状态的媒介，而非仅是</text><text x="282.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">语言叙事。</text><rect x="75.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">文献使用方式调查</text><text x="92.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">约1,000篇预印本中，25%明确把CoT作为可解释性</text><text x="92.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">技术。</text><rect x="455.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">短任务脱耦观察</text><text x="472.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">社论转述模型可输出无关推理文本，同时完成实</text><text x="472.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">际任务。</text><rect x="265.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">解释与监控边界</text><text x="282.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">文本可能是不完整外显，不能直接等同内部计算</text><text x="282.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">解释。</text><rect x="265.0" y="822" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">加强可监控性研究</text><text x="282.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">如何生成推理文本，以及能否用于安全监控，仍</text><text x="282.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">需研究。</text></svg>