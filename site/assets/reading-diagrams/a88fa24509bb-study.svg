<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 834" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的基准与检测过程</title><desc id="desc">仅概括摘要明确陈述的研究环节，不表达未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="834" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">按策略生成</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">配对</text><path d="M440.0,570 V601.0 H250.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">评估检测</text><path d="M440.0,570 V601.0 H630.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">考察行为</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">真实问卷与参与策略</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">不同学科的真实问卷，以及从生成、修改到智能</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">体填写的策略</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生成模型辅助回答</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用多个大语言模型，按参与策略生成问卷回答</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">与人类回答配对</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">模型辅助回答与真实人类回答配对，构成基准材</text><text x="282.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">料</text><rect x="75.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">评估现有文本检测器</text><text x="92.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察不同 AI 参与策略下的检测表现</text><rect x="455.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">聚合行为线索</text><text x="472.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用少样本、无需训练的聚合器整合行为线索</text></svg>