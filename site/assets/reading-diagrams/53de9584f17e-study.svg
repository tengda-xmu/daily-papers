<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1024" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的剪切模量逆向设计流程</title><desc id="desc">仅概括摘要明确陈述的数据生成、代理建模与逆向设计关系，不代表论文原图，也不补充未报告的算法配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1024" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">覆盖不同铺层</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供训练数据</text><path d="M235.0,506.0 H32 V886.0 H235.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">指定性能目标</text><rect x="235.0" y="62" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">非对称铺层序列</text><text x="252.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">覆盖广泛非对称铺层序列的层合板设计。</text><rect x="235.0" y="252" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">高保真有限元生成数据</text><text x="252.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">采用 ASTM V 形缺口剪切试验的有限元实现。</text><rect x="235.0" y="442" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">训练 LightGBM 代理模型</text><text x="252.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建立层合板设计变量到等效剪切模量的非线性映射。</text><rect x="235.0" y="632" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">预设剪切模量目标</text><text x="252.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">为逆向设计提供所需达到的目标模量。</text><rect x="235.0" y="822" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">逆向识别铺层序列</text><text x="252.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用训练后的代理模型寻找达到目标模量的铺层序列。</text></svg>