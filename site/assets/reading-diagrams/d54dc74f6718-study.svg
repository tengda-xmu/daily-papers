<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 834" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的寿命区间评价流程</title><desc id="desc">概括摘要明确描述的预测、区间构建与评价关系，不代表论文原图，也不补充未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="834" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">基于基准建立预测</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">形成寿命区间</text><path d="M440.0,570 V601.0 H250.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="250.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">分层检查表现</text><path d="M440.0,570 V601.0 H630.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="630.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">检查偏移表现</text><rect x="265.0" y="62" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">涡扇发动机基准数据</text><text x="282.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用 NASA C-MAPSS 数据，进行重复的发动机级</text><text x="282.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">校准划分。</text><rect x="265.0" y="252" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">建立寿命预测器</text><text x="282.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括岭回归、随机森林、梯度提升和多层感知机</text><text x="282.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="265.0" y="442" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="265.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="282.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">构建并比较预测区间</text><text x="282.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评价五种区间方法，包括全局分割共形、分段共</text><text x="282.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">形及分位数相关方法。</text><rect x="75.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">总体与临近失效评价</text><text x="92.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">检查覆盖率、区间宽度和高估真实剩余寿命的比</text><text x="92.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">例。</text><rect x="455.0" y="632" width="350.0" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="472.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">额外故障模式下评价</text><text x="472.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将基于 FD001 校准的模型用于 FD003，检查偏移</text><text x="472.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">下的覆盖与错误方向。</text></svg>