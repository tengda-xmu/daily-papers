<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1214" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的核验—修复闭环</title><desc id="desc">概括外部核验、双节点约束与规范追溯之间的关系，仅为摘要示意，并非论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">核验设计</text><path d="M43.0,316.0 H21 V696.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,316.0 H32 V886.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,570 V601.0 H190.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">违规条款追溯</text><path d="M43.0,696.0 H21 V1076.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,950 V981.0 H190.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">安全优先软约束</text><path d="M337.0,1076.0 H370 V316.0 H337.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">结构设计方案</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">多智能体大语言模型系统产生待核验的</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结构设计。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">外部物理核验</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">三层有限元核验系统向修复闭环提供反</text><text x="60.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">馈。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">检索增强规范库</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">支持将每项违规追溯至具体规范条款。</text><rect x="43.0" y="632" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">节点1：硬约束</text><text x="60.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将规范违规转化为硬性修复约束。</text><rect x="43.0" y="822" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">节点2：软约束</text><text x="60.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将四维质量评分转化为安全优先的软约</text><text x="60.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">束。</text><rect x="43.0" y="1012" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">修复设计</text><text x="60.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将外部反馈引入设计修复，并形成核验</text><text x="60.0" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">闭环。</text></svg>