<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1214" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的诊断与证据控制示意</title><desc id="desc">概括智能体调查、host证据控制与诊断提议之间的关系，不代表论文原图，也不补充摘要未说明的实现细节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较输入</text><path d="M190.0,380 V411.0 H190.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提交调查请求</text><path d="M190.0,570 V601.0 H190.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">受控证据使用</text><path d="M190.0,760 V791.0 H190.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">区分证据角色</text><path d="M190.0,950 V981.0 H190.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">诊断提议接受检查</text><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">信号与带标签参考</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">待诊断信号及每个候选类别的带标签参</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">智能体比较并提出测量</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较信号与参考，识别未解决的区别，</text><text x="60.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">提出后续测量。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">host检查请求与批次承诺</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">检查请求，要求在观察结果之前承诺完</text><text x="60.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">整工具批次。</text><rect x="43.0" y="632" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">host分配证据角色</text><text x="60.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">依据工具针对带标签参考的检查，区分</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">佐证支持与参考信息。</text><rect x="43.0" y="822" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">Judge Agent提出诊断</text><text x="60.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">由诊断裁决智能体提出诊断。</text><rect x="43.0" y="1012" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">host检查合规并记录</text><text x="60.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">控制器检查协议合规性并记录调查过程</text><text x="60.0" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text></svg>