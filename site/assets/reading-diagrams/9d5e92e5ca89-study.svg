<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的材料状态建模与塑性计算示意</title><desc id="desc">概括摘要明确描述的裂纹萌生预测链条及塑性计算加速分支，不表示论文原图或未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M313.3333333333333,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">标定参数用于材料描述</text><path d="M186.66666666666669,436 V467.0 H440.0 V498" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">纳入空间变化性能</text><path d="M566.6666666666666,218 V249.0 H440.00000000000006 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">循环域方法</text><path d="M566.6666666666666,218 V249.0 H693.3333333333334 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">时间积分方法</text><rect x="201.66666666666666" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="201.66666666666666" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="218.66666666666666" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">类铁路载荷实验</text><text x="218.66666666666666" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">覆盖对应不同轨头深度的材</text><text x="218.66666666666666" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">料状态，用于标定各向异性</text><text x="218.66666666666666" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">材料模型。</text><rect x="455.0" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="472.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">循环塑性计算加速</text><text x="472.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">针对长期塑性累积仿真的计</text><text x="472.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">算成本，研究不同的加速方</text><text x="472.0" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">法。</text><rect x="75.0" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">空间变化的材料性能</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合标定参数与现场测量重</text><text x="92.0" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建的累积剪应变分布，描述</text><text x="92.0" y="382" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">轨头材料状态。</text><rect x="328.33333333333337" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习循环域模型</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用神经网络或符号回归表达</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">塑性应变逐循环演化，预测</text><text x="345.33333333333337" y="382" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">循环响应。</text><rect x="581.6666666666667" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">神经网络显式时间积</text><text x="598.6666666666667" y="333" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">分器</text><text x="598.6666666666667" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过结构设计满足基本塑性</text><text x="598.6666666666667" y="385" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">约束，支持较大应变增量下</text><text x="598.6666666666667" y="406" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">的计算。</text><rect x="328.3333333333333" y="498" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="498" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="527" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">裂纹萌生预测框架</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">关注混合交通载荷与轮廓几</text><text x="345.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">何变化，采用考虑累积塑性</text><text x="345.3333333333333" y="600" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">变形的萌生准则。</text></svg>