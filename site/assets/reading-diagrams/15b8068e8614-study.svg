<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的三维浓度场预测示意</title><desc id="desc">概括CFD模拟训练代理模型，以及全局条件、局部空间描述用于预测的关系；不是论文原图，不表示未报告的网络结构。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于训练</text><path d="M440.00000000000006,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测输入</text><path d="M693.3333333333334,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测输入</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">快速预测</text><rect x="75.0" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">CFD模拟数据</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要报告使用760次CFD模拟</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">训练代理模型。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">全局运行条件</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">包括搅拌、进料、流体性质</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">及生物动力学等条件。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">局部空间描述</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">例如到进料点的距离。</text><rect x="328.3333333333333" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习代理模型</text><text x="345.3333333333333" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较的方法中，基于注意力</text><text x="345.3333333333333" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">机制的神经网络精度最高。</text><rect x="328.3333333333333" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">三维底物浓度场</text><text x="345.3333333333333" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">快速预测空间浓度分布，并</text><text x="345.3333333333333" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">捕捉关键混合特征。</text></svg>