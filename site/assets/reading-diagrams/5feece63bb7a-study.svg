<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 850" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的三分支融合预测示意</title><desc id="desc">概括摘要明确描述的信息处理与融合关系，不表示具体输入配置、网络参数或论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="850" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,194 V225.0 H186.66666666666669 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">材料属性</text><path d="M440.0,194 V225.0 H440.00000000000006 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">加载历史</text><path d="M440.0,194 V225.0 H693.3333333333334 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">局部应变波动</text><path d="M186.66666666666669,388 V419.0 H440.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">静态特征</text><path d="M440.00000000000006,388 V419.0 H440.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">时序特征</text><path d="M693.3333333333334,388 V419.0 H440.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">局部特征</text><path d="M440.0,582 V613.0 H440.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">综合损伤表示</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">异质信息来源</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">材料静态固有属性与加载历</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">史中的时序、应变波动信息</text><text x="345.3333333333333" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="75.0" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="92.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">DNN分支</text><text x="92.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">提取材料静态固有属性。</text><rect x="328.33333333333337" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="345.33333333333337" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">BiGRU与多头自注意力</text><text x="345.33333333333337" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">捕捉长期时序依赖，并自适</text><text x="345.33333333333337" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">应加权加载历史中的关键阶</text><text x="345.33333333333337" y="358" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">段。</text><rect x="581.6666666666667" y="256" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="598.6666666666667" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">一维卷积分支</text><text x="598.6666666666667" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">提取局部应变波动模式。</text><rect x="328.3333333333333" y="450" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">三分支特征融合</text><text x="345.3333333333333" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">融合为综合损伤表示。</text><rect x="328.3333333333333" y="644" width="223.33333333333334" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="345.3333333333333" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">端到端寿命预测</text><text x="345.3333333333333" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">模型输出为lg(Nf)。</text></svg>