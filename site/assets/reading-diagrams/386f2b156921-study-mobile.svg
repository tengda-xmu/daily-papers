<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1024" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述组织示意</title><desc id="desc">概括摘要明确列出的研究环节与评价框架；分支表示综述关注方向，不代表已验证的实验流水线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1024" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">梳理研究环节</text><path d="M43.0,126.0 H21 V506.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,126.0 H32 V696.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,126.0 H10 V886.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AI驱动的微生物酶工程</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">围绕从读取蛋白质空间到书写新设计的</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">转变展开综述。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">微生物序列空间挖掘</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察尚未充分表征的微生物序列空间。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生成式设计</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察以结构或序列为条件的生成式设计</text><text x="60.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="43.0" y="632" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习指导的定向进化</text><text x="60.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察机器学习参与定向进化的研究方向</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="43.0" y="822" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生物催化剂分层评价</text><text x="60.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作者提出从催化能力、选择性、可生产</text><text x="60.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">性和工艺适配性判断实用价值。</text></svg>