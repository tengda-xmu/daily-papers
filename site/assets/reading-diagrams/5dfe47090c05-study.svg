oft YaHei,sans-serif" font-size="14" fill="#3b5264">计</text><rect x="581.6666666666667" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">标签检测器</text><text x="598.6666666666667" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">并行训练 YOLOv8n 营养标签</text><text x="598.6666666666667" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">检测器</text><rect x="328.3333333333333" y="632" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">自然语言智能体</text><text x="345.3333333333333" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将系统组件作为工具提供</text></svg>