<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 834" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的抗爆分析与预测流程</title><desc id="desc">概括摘要明确陈述的研究环节，仅表示研究展开顺序，不表示未报告的数据传递或验证关系；此图不是论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="834" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于抗爆分析</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">随后开展参数分析</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">最后建立预测模型</text><rect x="235.0" y="62" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">BLEVE荷载的TNT当量处理</text><text x="252.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">采用TNT当量法评估BLEVE荷载作用下的抗爆问题。</text><rect x="235.0" y="252" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">T梁桥面有限元分析</text><text x="252.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建立有限元模型，分析疲劳对桥面抗爆性能的影响。</text><rect x="235.0" y="442" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">参数敏感性分析</text><text x="252.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察相关参数的影响，摘要报告TNT当量最为敏感。</text><rect x="235.0" y="632" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="252.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">最大位移机器学习预测</text><text x="252.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">采用5折交叉验证和贝叶斯超参数优化建立预测模型。</text></svg>