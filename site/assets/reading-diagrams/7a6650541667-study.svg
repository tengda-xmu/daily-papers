<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 719" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的双拓扑诊断流程</title><desc id="desc">仅概括摘要明确描述的证据组织与智能体任务，不代表论文原图，也不补充未报告的实现细节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="719" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,215 V246.0 H440.0 V277" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="264.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供运维证据</text><path d="M440.00000000000006,215 V246.0 H440.0 V277" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="264.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供物理依赖约束</text><path d="M693.3333333333334,215 V246.0 H440.0 V277" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="264.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供业务协作约束</text><path d="M440.0,430 V461.0 H440.0 V492" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="479.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于诊断与决策支持</text><rect x="75.0" y="62" width="223.33333333333334" height="153" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="153" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多模态运维信息</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">资产记录、设备状态、告警</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">、工单、车道业务事件、环</text><text x="92.0" y="164" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">境测量和暂态电信号。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="153" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="153" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理基础设施拓扑</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">描述供电、网络、机柜与设</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">备之间的依赖关系。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="153" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="153" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">业务协作拓扑</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">描述车道侧事件链与平台服</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">务。</text><rect x="328.3333333333333" y="277" width="223.33333333333334" height="153" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="277" width="4" height="153" rx="2" fill="#153e64"/><text x="345.3333333333333" y="306" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">结构化诊断证据包</text><text x="345.3333333333333" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">基于双重拓扑组织诊断所需</text><text x="345.3333333333333" y="358" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">证据。</text><rect x="328.3333333333333" y="492" width="223.33333333333334" height="153" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="492" width="4" height="153" rx="2" fill="#153e64"/><text x="345.3333333333333" y="521" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">大语言模型智能体</text><text x="345.3333333333333" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用证据包进行根因排序、</text><text x="345.3333333333333" y="573" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">证据解释、维护建议与工单</text><text x="345.3333333333333" y="594" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">草拟，支持人在回路的维护</text><text x="345.3333333333333" y="615" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">决策。</text></svg>