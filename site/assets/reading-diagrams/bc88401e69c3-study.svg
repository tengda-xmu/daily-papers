<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 862" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的集成框架示意</title><desc id="desc">展示摘要明确列出的数据对象、框架组成及异常表征与监督学习的关系；不表示具体执行顺序或未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="862" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H440.0 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">用于测试</text><path d="M440.0,394 V425.0 H186.66666666666669 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含</text><path d="M440.0,394 V425.0 H440.00000000000006 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含</text><path d="M440.0,394 V425.0 H693.3333333333334 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">包含</text><path d="M328.3333333333333,326.5 H21 V720.5 H201.66666666666666" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M328.3333333333333,326.5 H32 V720.5 H455.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M551.6666666666667,523.5 H581.6666666666667" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">MetroPT-3时间序列</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">地铁空气生产单元的电气、</text><text x="345.3333333333333" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">气动、热学及运行测量。</text><rect x="328.3333333333333" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">集成AI与机器学习框</text><text x="345.3333333333333" y="312" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">架</text><text x="345.3333333333333" y="343" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">联系异常检测、故障预测与</text><text x="345.3333333333333" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">维护优化。</text><rect x="75.0" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">时间特征工程</text><text x="92.0" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要列出的框架组成，具体</text><text x="92.0" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">特征构造未展开。</text><rect x="328.33333333333337" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">自编码器异常检测</text><text x="345.33333333333337" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以潜在异常表征连接监督学</text><text x="345.33333333333337" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">习。</text><rect x="581.6666666666667" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">监督预测模型</text><text x="598.6666666666667" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将构建的潜在异常表征纳入</text><text x="598.6666666666667" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">监督学习。</text><rect x="201.66666666666666" y="653" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="201.66666666666666" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="218.66666666666666" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多时间跨度预警分析</text><text x="218.66666666666666" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">分析不同预警时间跨度下的</text><text x="218.66666666666666" y="734" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">响应。</text><rect x="455.0" y="653" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="472.0" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">基于Pareto的维护优</text><text x="472.0" y="706" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">化</text><text x="472.0" y="737" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">涉及维护策略、风险阈值与</text><text x="472.0" y="758" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">归一化成本指数。</text></svg>