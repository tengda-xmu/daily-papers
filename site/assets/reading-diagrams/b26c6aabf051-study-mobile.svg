<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 862" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的MPINN-ERL方法关系</title><desc id="desc">仅概括摘要明确描述的样本增强、正则化与权重调节关系，并非论文原图，不表达具体训练顺序或未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="862" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M43.0,129.5 H10 V720.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M190.0,394 V425.0 H190.0 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">动态调整权重</text><path d="M190.0,591 V622.0 H190.0 V653" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="640.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">融入诊断网络</text><rect x="43.0" y="62" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">条件通道—空间Wasserstein GA</text><text x="60.0" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">N</text><text x="60.0" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">生成增强故障样本，以缓解有限样本问</text><text x="60.0" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">题。</text><rect x="43.0" y="259" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">新损失函数与增强强化学习</text><text x="60.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">用于动态调整物理启发动态残差正则化</text><text x="60.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">的权重。</text><rect x="43.0" y="456" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理启发动态残差正则化</text><text x="60.0" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过正则化模块融入诊断系统，旨在改</text><text x="60.0" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">善诊断稳定性。</text><rect x="43.0" y="653" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多尺度卷积双向门控循环单元</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为诊断网络，融入物理启发的动态残</text><text x="60.0" y="734" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">差正则化。</text></svg>