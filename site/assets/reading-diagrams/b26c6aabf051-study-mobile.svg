<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 862" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的MPINN-ERL组成关系</title><desc id="desc">概括样本增强、诊断模型与正则化权重调节的关系，不表示论文的具体训练顺序或实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="862" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M43.0,129.5 H10 V523.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M337.0,720.5 H359 V523.5 H337.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M43.0,326.5 H32 V720.5 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">条件通道—空间Wasserstein GA</text><text x="60.0" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">N</text><text x="60.0" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">生成增强故障样本，用于缓解样本不足</text><text x="60.0" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">问题。</text><rect x="43.0" y="259" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">损失函数与增强强化学习</text><text x="60.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">动态调整物理启发动态残差正则化的权</text><text x="60.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">重。</text><rect x="43.0" y="456" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">多尺度卷积与双向门控循环单</text><text x="60.0" y="509" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">元</text><text x="60.0" y="540" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">构成研究所提出诊断模型的组成部分。</text><rect x="43.0" y="653" width="294" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="653" width="4" height="135" rx="2" fill="#153e64"/><text x="60.0" y="682" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">物理启发动态残差正则化</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">通过残差正则化模块融入诊断系统。</text></svg>