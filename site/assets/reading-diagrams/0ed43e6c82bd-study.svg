<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 665" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述内容示意</title><desc id="desc">概括摘要明确列出的梳理与分析关系，不代表实验流程、性能比较结果或论文原图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="665" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H186.66666666666669 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">系统总结</text><path d="M440.0,197 V228.0 H440.00000000000006 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">方法对照</text><path d="M440.0,197 V228.0 H693.3333333333334 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">局限分析</text><path d="M328.3333333333333,129.5 H10 V523.5 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">旋转机械故障诊断综</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">述</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">聚焦非平稳工况与小样本约</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">束下的深度生成模型应用。</text><rect x="75.0" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">梳理模型与应用</text><text x="92.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">覆盖多类生成模型，以及数</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">据生成、域适应与泛化、多</text><text x="92.0" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">模态融合和诊断任务。</text><rect x="328.33333333333337" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">对照传统方法</text><text x="345.33333333333337" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将深度生成模型与传统信号</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">处理方法、标准深度学习模</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">型进行对照。</text><rect x="581.6666666666667" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">分析应用瓶颈</text><text x="598.6666666666667" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">关注参数高效微调、可解释</text><text x="598.6666666666667" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">性与可靠性、边缘部署计算</text><text x="598.6666666666667" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">效率。</text><rect x="328.3333333333333" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">讨论未来方向</text><text x="345.3333333333333" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">涉及少样本或零样本学习、</text><text x="345.3333333333333" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">多模态生成、物理信息混合</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">架构及强化学习结合。</text></svg>