<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的建模与算法关系示意</title><desc id="desc">仅概括摘要明确陈述的问题、建模内容及算法机制，不代表论文原图，也不补充未报告的算法配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="728" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,218 V249.0 H186.66666666666669 V280" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="267.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">建立问题模型</text><path d="M328.3333333333333,140.0 H21 V576.0 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M440.00000000000006,436 V467.0 H440.0 V498" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">限制策略采样</text><path d="M693.3333333333334,436 V467.0 H440.0 V498" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供学习反馈</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">动态人机协作调度问</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">题</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">动态作业到达，结合系统状</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">态选择工作站、加工模式与</text><text x="345.3333333333333" y="188" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">资源。</text><rect x="75.0" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="92.0" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">混合整数非线性规划</text><text x="92.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">建模</text><text x="92.0" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">描述作业到达、可选模式、</text><text x="92.0" y="385" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">资源分配及疲劳相关加工时</text><text x="92.0" y="406" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">间。</text><rect x="328.33333333333337" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="345.33333333333337" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">动作掩码</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将策略采样限制在结构上可</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">行的作业—模式—资源组合。</text><rect x="581.6666666666667" y="280" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="280" width="4" height="156" rx="2" fill="#153e64"/><text x="598.6666666666667" y="309" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">按时间缩放的势函数</text><text x="598.6666666666667" y="333" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">塑形</text><text x="598.6666666666667" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">为长时域学习提供稠密反馈</text><text x="598.6666666666667" y="385" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.3333333333333" y="498" width="223.33333333333334" height="156" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="498" width="4" height="156" rx="2" fill="#153e64"/><text x="345.3333333333333" y="527" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AMPS-MAPPO调度算法</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">面向平均流动时间与工人疲</text><text x="345.3333333333333" y="579" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">劳均衡指数的加权目标。</text></svg>