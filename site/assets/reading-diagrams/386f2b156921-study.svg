<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述议题示意</title><desc id="desc">展示作者考察的研究环节及共同关注的问题；这是摘要整理示意，不是论文原图，也不表示经过验证的实验流水线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="468" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H186.66666666666669 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">纳入梳理</text><path d="M440.0,197 V228.0 H440.00000000000006 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">纳入梳理</text><path d="M440.0,197 V228.0 H693.3333333333334 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">纳入梳理</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AI与微生物生物催化</text><text x="345.3333333333333" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">梳理从读取到编写蛋白质世</text><text x="345.3333