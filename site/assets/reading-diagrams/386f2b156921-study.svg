<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 665" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述组织示意</title><desc id="desc">概括摘要明确列出的研究环节与评价框架；分支表示综述关注方向，不代表已验证的实验流水线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="665" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H186.66666666666669 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">梳理研究环节</text><path d="M440.0,197 V228.0 H440.00000000000006 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">梳理研究环节</text><path d="M440.0,197 V228.0 H693.3333333333334 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">梳理研究环节</text><path d="M328.3333333333333,129.5 H10 V523.5 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">AI驱动的微生物酶工</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">程</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">围绕从读取蛋白质空间到书</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">写新设计的转变展开综述。</text><rect x="75.0" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">微生物序列空间挖掘</text><text x="92.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察尚未充分表征的微生物</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">序列空间。</text><rect x="328.33333333333337" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生成式设计</text><text x="345.33333333333337" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察以结构或序列为条件的</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">生成式设计。</text><rect x="581.6666666666667" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">机器学习指导的定向</text><text x="598.6666666666667" y="312" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">进化</text><text x="598.6666666666667" y="343" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察机器学习参与定向进化</text><text x="598.6666666666667" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">的研究方向。</text><rect x="328.3333333333333" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">生物催化剂分层评价</text><text x="345.3333333333333" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作者提出从催化能力、选择</text><text x="345.3333333333333" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">性、可生产性和工艺适配性</text><text x="345.3333333333333" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">判断实用价值。</text></svg>