<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1214" role="img" aria-labelledby="title desc"><title id="title">拟议路线：非比例加载下的门控与安全回退</title><desc id="desc">对应第一条研究建议；所有分组、门槛与改进目标均为拟议设计，不是原论文实测结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="14">拟开展的验证路线</text><path d="M440.0,190 V221.0 H440.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">防止路径泄漏</text><path d="M440.0,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">训练与验证</text><path d="M440.0,570 V601.0 H440.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提出候选更新</text><path d="M440.0,760 V791.0 H440.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">异常触发处理</text><path d="M235.0,696.0 H21 V1076.0 H235.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M440.0,950 V981.0 H440.0 V1012" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="999.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">累计代价与误差</text><path d="M645.0,1076.0 H870 V126.0 H645.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="235.0" y="62" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="62" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">生成多类加载路径</text><text x="252.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建议120条路径，覆盖比例、方向旋转与反向加载</text><rect x="235.0" y="252" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="252" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">按路径隔离数据</text><text x="252.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">建议72条训练、24条验证、24条测试</text><rect x="235.0" y="442" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="442" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">学习并保持一致性</text><text x="252.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">保留原不变量、张量方向与c修正机制</text><rect x="235.0" y="632" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="632" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">整步与半步误差门控</text><text x="252.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较两种更新，利用参考解校准误差门槛</text><rect x="235.0" y="822" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="822" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">自适应子步或回退</text><text x="252.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">误差过大时细分，失败或超限时使用后向Euler</text><rect x="235.0" y="1012" width="410" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="235.0" y="1012" width="4" height="128" rx="2" fill="#0f766e"/><text x="252.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#0f766e">同等误差下审计收益</text><text x="252.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评估误差尾部、失败率、回退率和总CPU时间</text></svg>