<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1214" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的断层网络定制流程</title><desc id="desc">概括从基础网络解释到本地训练及结果比较的关系，仅为摘要示意，不是论文原图，也不表示未报告的实验配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1214" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,190 V221.0 H190.0 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">针对基准解释局限</text><path d="M190.0,380 V411.0 H190.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">断层线用于训练</text><path d="M190.0,570 V601.0 H190.0 V632" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="619.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">应用定制网络</text><path d="M190.0,760 V791.0 H190.0 V822" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="809.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">构造解释结果</text><path d="M43.0,696.0 H21 V1076.0 H43.0" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="43.0" y="62" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">基础网络建立基准</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将多个基础断层网络用于三维地震数据</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">，识别主要断层并观察解释局限。</text><rect x="43.0" y="252" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">属性辅助人工解释</text><text x="60.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合地震属性，从选定主测线与联络测</text><text x="60.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">线剖面提取人工解释的断层线。</text><rect x="43.0" y="442" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">定制训练与质量控制</text><text x="60.0" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">利用断层线训练定制网络，通过迭代训</text><text x="60.0" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">练与质量控制细化解释。</text><rect x="43.0" y="632" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="632" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="661" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">应用于整个地震体</text><text x="60.0" y="692" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将定制网络用于完整地震体，并与基础</text><text x="60.0" y="713" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">模型的解释结果比较。</text><rect x="43.0" y="822" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="822" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="851" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">断层几何与连续性改善</text><text x="60.0" y="882" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要报告连续性、小断层刻画及时间切</text><text x="60.0" y="903" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">片和垂直剖面的地质一致性改善。</text><rect x="43.0" y="1012" width="294" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1012" width="4" height="128" rx="2" fill="#153e64"/><text x="60.0" y="1041" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">与井资料更加吻合</text><text x="60.0" y="1072" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要报告改进后的断层框架与井资料一</text><text x="60.0" y="1093" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">致性提高。</text></svg>