<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1238" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的定制断层解释流程</title><desc id="desc">概括基准解释、定制训练及全体积应用的关系；这是摘要示意图，不是论文原图，不表示摘要未报告的网络配置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="380" height="1238" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M190.0,194 V225.0 H190.0 V256" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="243.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">形成基准</text><path d="M190.0,388 V419.0 H190.0 V450" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="437.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">针对解释不足</text><path d="M190.0,582 V613.0 H190.0 V644" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="631.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">提供训练解释</text><path d="M190.0,776 V807.0 H190.0 V838" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="825.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">应用定制网络</text><path d="M190.0,970 V1001.0 H190.0 V1032" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190.0" y="1019.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">与基础网络比较</text><rect x="43.0" y="62" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="62" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">地震数据与基础网络</text><text x="60.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">将多个基础断层检测网络应用于高质量</text><text x="60.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">三维地震数据。</text><rect x="43.0" y="256" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="256" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="285" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">建立基准构造框架</text><text x="60.0" y="316" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">识别主要断层走向，同时发现连续性、</text><text x="60.0" y="337" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">次级断层检出和跨地层一致性的不足。</text><rect x="43.0" y="450" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="450" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="479" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">准备本地断层解释</text><text x="60.0" y="510" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">从选定主测线和联络测线剖面提取人工</text><text x="60.0" y="531" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">断层解释线，解释过程由地震属性辅助</text><text x="60.0" y="552" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="43.0" y="644" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="644" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="673" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">定制训练与迭代质控</text><text x="60.0" y="704" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以断层解释线训练定制网络，迭代优化</text><text x="60.0" y="725" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">可检测性、方位保真度及构造连贯性。</text><rect x="43.0" y="838" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="838" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="867" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">应用于整个地震数据体</text><text x="60.0" y="898" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">在时间切片和垂直剖面中评价断层解释</text><text x="60.0" y="919" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结果。</text><rect x="43.0" y="1032" width="294" height="132" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="43.0" y="1032" width="4" height="132" rx="2" fill="#153e64"/><text x="60.0" y="1061" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">报告解释改善</text><text x="60.0" y="1092" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要报告连续性、小断层刻画、几何合</text><text x="60.0" y="1113" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">理性及与井资料吻合度的改善。</text></svg>