<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的粗糙度预测配置</title><desc id="desc">概括摘要明确列出的输入与模型关系，仅为摘要示意，不是论文原图，不表示三类输入在同一模型中全部融合。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="644" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M186.66666666666669,190 V221.0 H186.66666666666669 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">输入</text><path d="M440.00000000000006,190 V221.0 H440.00000000000006 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">输入</text><path d="M693.3333333333334,190 V221.0 H693.3333333333334 V252" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="239.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">输入</text><path d="M186.66666666666669,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测</text><path d="M440.00000000000006,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测</text><path d="M693.3333333333334,380 V411.0 H440.0 V442" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.0" y="429.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">预测</text><rect x="75.0" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">GLCM纹理特征</text><text x="92.0" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">以图像纹理作为线性回归的</text><text x="92.0" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">输入。</text><rect x="328.33333333333337" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">图像纹理与加工参数</text><text x="345.33333333333337" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">加工参数包括主轴转速与进</text><text x="345.33333333333337" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">给率。</text><rect x="581.6666666666667" y="62" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="62" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">切屑形貌特征</text><text x="598.6666666666667" y="122" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">从切屑图像提取切屑面积与</text><text x="598.6666666666667" y="143" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">卷曲指数。</text><rect x="75.0" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="92.0" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">线性回归</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要列出的纹理特征预测配</text><text x="92.0" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">置。</text><rect x="328.33333333333337" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="345.33333333333337" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">XGBoost：纹理与参数</text><text x="345.33333333333337" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合图像纹理与加工参数建</text><text x="345.33333333333337" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">立预测。</text><rect x="581.6666666666667" y="252" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="252" width="4" height="128" rx="2" fill="#153e64"/><text x="598.6666666666667" y="281" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">XGBoost：切屑形貌</text><text x="598.6666666666667" y="312" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">使用切屑形貌特征建立预测</text><text x="598.6666666666667" y="333" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">。</text><rect x="328.3333333333333" y="442" width="223.33333333333334" height="128" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="442" width="4" height="128" rx="2" fill="#153e64"/><text x="345.3333333333333" y="471" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">钻孔内壁粗糙度估计</text><text x="345.3333333333333" y="502" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">各配置均以表面粗糙度预测</text><text x="345.3333333333333" y="523" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">为目标。</text></svg>