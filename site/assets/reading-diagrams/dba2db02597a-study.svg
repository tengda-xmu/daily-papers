<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 665" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的综述内容关系示意</title><desc id="desc">展示摘要明确涉及的损伤分析、材料比较与寿命预测关系，不代表论文原图或实验流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="665" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H186.66666666666669 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">考察损伤耦合</text><path d="M186.66666666666669,394 V425.0 H313.3333333333333 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="313.3333333333333" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">说明模型局限</text><path d="M440.0,197 V228.0 H440.00000000000006 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较材料体系</text><path d="M440.00000000000006,394 V425.0 H566.6666666666666 V456" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="566.6666666666666" y="443.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较裂纹行为</text><path d="M440.0,197 V228.0 H693.3333333333334 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">评述预测方法</text><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">活塞疲劳与断裂可靠</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">性综述</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">研究对象为轻量化、高功率</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">密度柴油活塞。</text><rect x="75.0" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">疲劳—蠕变—氧化耦合</text><text x="92.0" y="312" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">损伤</text><text x="92.0" y="343" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">结合服役载荷与易失效关键</text><text x="92.0" y="364" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">区域展开讨论。</text><rect x="328.33333333333337" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">不同材料活塞的比较</text><text x="345.33333333333337" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">涵盖铝硅合金、钢及钢顶—铝</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">裙复合活塞。</text><rect x="581.6666666666667" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">寿命预测方法评述</text><text x="598.6666666666667" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">涵盖 Coffin–Manson 模型、</text><text x="598.6666666666667" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">连续损伤力学及机器学习辅</text><text x="598.6666666666667" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">助框架。</text><rect x="201.66666666666666" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="201.66666666666666" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="218.66666666666666" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">单一机制模型的不足</text><text x="218.66666666666666" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">摘要指出其难以充分解释真</text><text x="218.66666666666666" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">实条件下的问题。</text><rect x="455.0" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="455.0" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="472.0" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">裂纹萌生与扩展</text><text x="472.0" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">作为不同材料活塞的比较内</text><text x="472.0" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">容。</text></svg>