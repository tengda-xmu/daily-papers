<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 665" role="img" aria-labelledby="title desc"><title id="title">依据摘要整理的活塞可靠性综述框架</title><desc id="desc">概括摘要明确列出的综述对象与评述内容，不代表论文原图，也不表示实验步骤或技术验证流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6d879b" stroke-width="1.4"/></marker></defs><rect width="880" height="665" fill="#f7fafc" rx="12"/><text x="32" y="32" fill="#153e64" font-family="Microsoft YaHei, sans-serif" font-size="14">研究逻辑</text><path d="M440.0,197 V228.0 H186.66666666666669 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="186.66666666666669" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">考察损伤背景</text><path d="M440.0,197 V228.0 H440.00000000000006 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440.00000000000006" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">比较裂纹行为</text><path d="M440.0,197 V228.0 H693.3333333333334 V259" fill="none" stroke="#6d879b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="693.3333333333334" y="246.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#526b7e" stroke="#f7fafc" stroke-width="4" paint-order="stroke">评述预测方法</text><path d="M328.3333333333333,129.5 H10 V523.5 H328.3333333333333" fill="none" stroke="#6d879b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="328.3333333333333" y="62" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="62" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="91" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">轻量化高功率密度活</text><text x="345.3333333333333" y="115" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">塞综述</text><text x="345.3333333333333" y="146" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">围绕热—机械疲劳、裂纹演化</text><text x="345.3333333333333" y="167" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">与断裂可靠性组织研究。</text><rect x="75.0" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="75.0" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="92.0" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">服役载荷与耦合损伤</text><text x="92.0" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察易失效区域及疲劳—蠕变</text><text x="92.0" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">—氧化耦合损伤。</text><rect x="328.33333333333337" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.33333333333337" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="345.33333333333337" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">不同材料的裂纹行为</text><text x="345.33333333333337" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">比较铝硅合金、钢和钢顶—铝</text><text x="345.33333333333337" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">裙复合活塞的裂纹萌生与扩</text><text x="345.33333333333337" y="361" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">展。</text><rect x="581.6666666666667" y="259" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="581.6666666666667" y="259" width="4" height="135" rx="2" fill="#153e64"/><text x="598.6666666666667" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">寿命预测方法</text><text x="598.6666666666667" y="319" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">评述经验模型、连续损伤力</text><text x="598.6666666666667" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">学与机器学习辅助框架。</text><rect x="328.3333333333333" y="456" width="223.33333333333334" height="135" rx="7" fill="#fff" stroke="#d5e2e9"/><rect x="328.3333333333333" y="456" width="4" height="135" rx="2" fill="#153e64"/><text x="345.3333333333333" y="485" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#153e64">损伤缓解策略</text><text x="345.3333333333333" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">考察材料、结构设计、先进</text><text x="345.3333333333333" y="537" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#3b5264">制造和热障涂层。</text></svg>