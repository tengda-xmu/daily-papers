<section id="paper-library" aria-labelledby="library-heading" data-local-only data-local-page>
  <h1 id="library-heading" class="sr-only">我的文献</h1>
  <form id="library-filters" class="compact-filters" role="search">
    <div class="search-row"><label class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索</span><input id="library-query" type="search" placeholder="标题、作者、期刊或 DOI"></label><button id="library-filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="library-filter-panel" hidden>筛选</button></div>
    <div id="library-filter-panel" class="filter-panel filter-fields">
    <label>研究方向<select data-filter-label="研究方向" id="library-topic"><option value="">全部方向</option></select></label>
    <label>重要性<select data-filter-label="重要性" id="library-rating"><option value="0">全部星级</option><option value="1">已标星</option><option value="2">2 星及以上</option><option value="3">3 星及以上</option><option value="4">4 星及以上</option><option value="5">5 星</option></select></label>
    <label class="library-checkbox"><input id="library-translated" data-filter-label="已保存译文" type="checkbox">已保存译文</label>
    </div>
    <div id="library-filter-chips" class="filter-chips" aria-label="已启用的筛选条件" hidden></div>
  </form>
  <div class="compact-results"><span id="library-count" role="status"></span><label class="compact-sort"><span class="sr-only">排序</span><select id="library-sort"><option value="recent">最近操作</option><option value="importance">重要性优先</option></select></label><div class="compact-result-actions"><button id="library-reset" type="button" class="text-button">重置筛选</button><a href="setup.html#library-backup">备份与恢复</a></div></div>
  <div id="library-list"></div>
  <p id="library-empty" hidden>没有符合条件的文献。给推荐论文标星，或载入 PDF 后，这里会自动收录。</p>
  <nav class="library-pagination" aria-label="文献库分页"><label>每页 <select id="library-page-size"><option value="20">20 篇</option><option value="50">50 篇</option><option value="100">100 篇</option></select></label><button type="button" id="library-previous">上一页</button><span id="library-page"></span><button type="button" id="library-next">下一页</button></nav>
</section>
