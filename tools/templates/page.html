<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#153e64">
  <title>$title</title>
  <link rel="icon" href="${root}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="${root}assets/site.css?v=$version">
  <link rel="stylesheet" href="${root}assets/paper-chat.css?v=$version">
  <script src="${root}assets/site.js?v=$version" defer></script>
  <script src="${root}assets/paper-chat.js?v=$version" defer></script>
$search_assets
</head>
<body id="top">
  <a class="skip-link" href="#main-content">跳至正文</a>
  <header class="site-header">
    <div class="nav-inner">
      <a class="wordmark" href="$root"><span>腾达</span><span class="wordmark-divider" aria-hidden="true"></span>科研文献</a>
      <button class="menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false">菜单 <span aria-hidden="true">☰</span></button>
      <nav id="main-navigation" class="main-navigation" aria-label="主导航">
        <a href="$root" $daily_current>每日推荐</a>
        <a href="${root}search.html" $search_current>手动检索</a>
        <a href="${root}archive/" $archive_current>历史归档</a>
        <a href="${root}setup.html" $setup_current>设置</a>

  </header>

      $content

    </main>
  </div>
  <p class="toast" id="toast" role="status" hidden></p>
  <a class="back-to-top" href="#top" aria-label="返回页面顶部" hidden>回到顶部 ↑</a>
