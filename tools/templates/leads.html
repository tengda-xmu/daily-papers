<section id="wechat-articles" class="research-leads" aria-labelledby="leads-heading">
  <h1 id="leads-heading" class="sr-only">科研线索、学术会议与征稿</h1>
  <div class="issue-meta"><span>科研线索 · $count 条线索</span><span><time>$generated</time> 最近采集</span><a href="setup.html#wechat" data-local-only>订阅与来源设置</a></div>
  <p class="section-description">会议、征稿、研究动态与实用资源。汇总近 $days 天公众号与官方公告，会议另按会期整理。</p>
  <div class="lead-categories" role="group" aria-label="线索分类">
    <button type="button" data-lead-kind="all" aria-pressed="true">全部 <span>$count</span></button>$categories
  </div>
  <form id="lead-filters" class="lead-filters" role="search" aria-label="筛选科研线索">
    <label class="lead-query">搜索<input id="lead-query" type="search" placeholder="会议、主题、公众号或关键词" autocomplete="off"></label>
    <label>研究方向<select id="lead-topic"><option value="">全部方向</option>$topics</select></label>
    <label>来源<select id="lead-provider"><option value="">全部来源</option><option value="official">官方来源</option><option value="wechat">微信公众号</option></select></label>
    <label>时间状态<select id="lead-state"><option value="">全部状态</option><option value="active">排除已结束 / 已截止</option><option value="upcoming">即将召开</option><option value="ended">已结束 / 已截止</option></select></label>
    <label>排序<select id="lead-sort"><option value="recommended">推荐顺序</option><option value="date">会期 / 截止时间</option><option value="latest">最新发布</option></select></label>
  </form>
  <div class="lead-results"><span id="lead-count" role="status" aria-live="polite">$count 条线索</span><button id="lead-reset" type="button" class="text-button">重置筛选</button></div>
  <ul id="lead-list" class="lead-list">$entries</ul>
  <p id="lead-empty" class="empty" hidden>没有符合条件的线索，请尝试其他分类或清除筛选。</p>
  <nav id="lead-pagination" class="lead-pagination" aria-label="线索分页" hidden>
    <label>每页 <select id="lead-page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label>
    <button type="button" id="lead-prev">上一页</button><span id="lead-page" role="status"></span><button type="button" id="lead-next">下一页</button>
  </nav>
  $source_status
  <p class="section-description">公众号的“公开检索入口”提供搜索片段，请核对原文；线索不占用核心推荐与扩展阅读名额。</p>
</section>
