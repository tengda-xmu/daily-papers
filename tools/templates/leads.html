<section id="wechat-articles" class="research-leads" aria-labelledby="leads-heading">
  <h1 id="leads-heading" class="sr-only">科研线索、学术会议与征稿</h1>
  <div class="issue-meta"><span>科研线索 · $count 条线索</span><span><time>$generated</time> 最近采集</span><a href="setup.html#wechat" data-local-only>订阅与来源设置</a></div>
  <div class="lead-categories" role="group" aria-label="线索分类">
    <button type="button" data-lead-kind="all" aria-pressed="true">全部 <span>$count</span></button>$categories
  </div>
  <form id="lead-filters" class="compact-filters" role="search" aria-label="筛选科研线索">
    <div class="search-row"><label class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索</span><input id="lead-query" type="search" placeholder="会议、主题、公众号或关键词" autocomplete="off"></label><button id="lead-filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="lead-filter-panel" hidden>筛选</button></div>
    <div id="lead-filter-panel" class="filter-panel filter-fields">
    <label>研究方向<select data-filter-label="研究方向" id="lead-topic"><option value="">全部方向</option>$topics</select></label>
    <label>来源<select data-filter-label="来源" id="lead-provider"><option value="">全部来源</option><option value="official">官方渠道</option><option value="wechat">微信公众号</option><option value="xiaohongshu">小红书</option></select></label>
    <label>公众号或作者<select data-filter-label="公众号或作者" id="lead-author"><option value="">全部账号</option>$authors</select></label>
    <label>时间状态<select data-filter-label="时间状态" id="lead-state"><option value="">默认（申请排除已截止）</option><option value="all">全部状态</option><option value="active">排除已结束 / 已截止</option><option value="open">正在申请</option><option value="closing">即将截止</option><option value="planned">尚未开放</option><option value="standing">常年受理</option><option value="unknown">待核对</option><option value="upcoming">即将召开</option><option value="ended">已结束 / 已截止</option></select></label>
    <label>具体类型<select data-filter-label="具体类型" id="lead-subtype"><option value="">全部类型</option>$subtypes</select></label>
    <label>国家或地区<select data-filter-label="国家或地区" id="lead-region"><option value="">全部地区</option>$regions</select></label>
    <label>企业项目<select data-filter-label="企业项目" id="lead-group"><option value="">全部机构</option><option value="enterprise">所有企业项目</option>$groups</select></label>
    </div>
    <div id="lead-filter-chips" class="filter-chips" aria-label="已启用的筛选条件" hidden></div>
  </form>
  <div class="lead-results compact-results"><span id="lead-count" role="status" aria-live="polite">$count 条线索</span>
    <form id="lead-period-form" class="period-control" aria-label="按发布时间筛选" novalidate>
      <label class="compact-sort"><span class="sr-only">发布时间</span><select id="lead-period" aria-describedby="lead-period-hint"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90" selected>最近 90 天</option><option value="all">全部时间</option><option value="custom">自定义</option></select></label>
      <span id="lead-period-custom" class="period-custom" hidden><label>最近 <input id="lead-period-days" type="number" min="1" max="3650" step="1" inputmode="numeric" required aria-label="自定义天数" aria-describedby="lead-period-error"> 天</label><button type="submit">应用</button></span>
      <span id="lead-period-hint" class="period-hint">仅筛选已收录内容</span><span id="lead-period-error" class="period-error" role="alert" hidden></span>
    </form>
    <label class="compact-sort"><span class="sr-only">排序</span><select id="lead-sort"><option value="recommended">推荐顺序</option><option value="date">会期 / 截止时间</option><option value="latest">最新发布</option></select></label><div class="compact-result-actions"><button id="lead-reset" type="button" class="text-button">重置筛选</button></div></div>
  <ul id="lead-list" class="lead-list">$entries</ul>
  <p id="lead-empty" class="empty" hidden>没有符合条件的线索，可扩大时间范围、选择全部时间或清除筛选。</p>
  <nav id="lead-pagination" class="lead-pagination" aria-label="线索分页" hidden>
    <label>每页 <select id="lead-page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label>
    <button type="button" id="lead-prev">上一页</button><span id="lead-page" role="status"></span><button type="button" id="lead-next">下一页</button>
  </nav>
  $source_status
  <p class="section-description">公众号的“公开检索入口”提供搜索片段，请核对原文；线索不占用核心推荐与扩展阅读名额。</p>
</section>
