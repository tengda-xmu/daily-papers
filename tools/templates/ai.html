<section class="ai-updates" aria-labelledby="ai-heading">
  <h1 id="ai-heading" class="sr-only">AI 前沿</h1>
  <div class="issue-meta"><span>AI 前沿 · $count 条进展</span><span>$generated 最近采集</span><span>每日 21:00 · 北京时间</span></div>
  <div class="lead-categories" role="group" aria-label="AI 分类"><button type="button" data-lead-kind="all" aria-pressed="true">全部 <span>$count</span></button>$categories</div>
  <form id="lead-filters" class="compact-filters" role="search" aria-label="筛选AI 进展">
    <div class="search-row"><label class="search-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">搜索</span><input id="lead-query" type="search" placeholder="模型、智能体、Skills 或关键词" autocomplete="off"></label><button id="lead-filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="lead-filter-panel" hidden>筛选</button></div>
    <div id="lead-filter-panel" class="filter-panel filter-fields">
    <label>应用场景<select data-filter-label="应用场景" id="lead-topic"><option value="">全部场景</option>$topics</select></label>
    <label>发布机构<select data-filter-label="发布机构" id="lead-provider"><option value="">全部机构</option>$providers</select></label>
    <label>来源平台<select data-filter-label="来源平台" id="lead-platform"><option value="">全部来源</option><option value="official">官方渠道</option><option value="wechat">微信公众号</option><option value="xiaohongshu">小红书</option></select></label>
    <label>公众号或作者<select data-filter-label="公众号或作者" id="lead-author"><option value="">全部账号</option>$authors</select></label>
    <label>发布时间<select data-filter-label="发布时间" id="lead-period"><option value="30">最近 30 天</option><option value="7">最近 7 天</option><option value="90">最近 90 天</option><option value="all">全部时间</option></select></label>
    </div>
    <div id="lead-filter-chips" class="filter-chips" aria-label="已启用的筛选条件" hidden></div>
  </form>
  <div class="lead-results compact-results"><span id="lead-count" role="status" aria-live="polite">$count 条进展</span><span id="lead-period-summary" class="filter-scope">最近 30 天</span><label class="compact-sort"><span class="sr-only">排序</span><select id="lead-sort"><option value="recommended">科研用途优先</option><option value="latest">最新发布</option></select></label><div class="compact-result-actions"><button id="lead-reset" type="button" class="text-button">重置筛选</button></div></div>
  <ul id="lead-list" class="lead-list">$entries</ul>
  <p id="lead-empty" class="empty" hidden>没有符合条件的进展，可扩大时间范围或重置筛选。</p>
  <nav id="lead-pagination" class="lead-pagination" aria-label="AI 进展分页" hidden>
    <label>每页 <select id="lead-page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label>
    <button type="button" id="lead-prev">上一页</button><span id="lead-page" role="status"></span><button type="button" id="lead-next">下一页</button>
  </nav>
  $source_status
</section>
