name: Publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/custom-journals.json', 'config/research-directions.json', 'config/custom-wechat.json', 'config/research-leads.json', 'config/ai-sources.json', 'config/opportunity-sources.json', 'config/xiaohongshu-notes.json', 'config/social-sources.json']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-papers-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Preserve published WeChat subscription directory
        shell: bash
        run: |
          path="data/inbox/wechat-subscriptions.json"
          if git fetch origin connector-data && git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
            mkdir -p data/inbox
            git show "FETCH_HEAD:${path}" > "$path"
          fi
      - name: Import validated reading enrichment and recover published editions
        run: python -m tools.recommendation_data --recover --reconcile --import-readings
      - name: Collect missing original paper figures
        timeout-minutes: 8
        continue-on-error: true
        run: python -m tools.collect_figures
      - name: Import AI reading enrichment
        run: python -m tools.public_updates --import-readings
      - name: Translate paper titles independently of reading notes
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m tools.translate_paper_titles
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
        id: deployment
