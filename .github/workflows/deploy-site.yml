name: Publish website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-papers-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Preserve published WeChat subscription directory
        shell: bash
        run: |
          path="data/inbox/wechat-subscriptions.json"
          if git fetch origin connector-data && git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
            mkdir -p data/inbox
            git show "FETCH_HEAD:${path}" > "$path"
          fi
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
        id: deployment
