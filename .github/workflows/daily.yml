name: Daily papers
run-name: ${{ inputs.scheduled_check && format('Morning check {0}', inputs.request_id) || inputs.request_id && format('Manual papers {0}', inputs.request_id) || 'Daily papers' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Browser update request identifier
        type: string
        default: ''
      send_digest:
        description: Send Enterprise WeChat digest
        type: boolean
        default: false
      scheduled_check:
        description: Only update when today's morning edition is missing
        type: boolean
        default: false
  schedule:
    - cron: "0 22 * * *" # 06:00 Asia/Shanghai (UTC)
    - cron: "17,37 22 * * *" # 06:17 / 06:37 catch-up, away from the hourly peak
    - cron: "17 23 * * *" # 07:17 final morning catch-up
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-papers-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.freshness.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main} # Queued checks must see the preceding run's committed data.
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Check today's morning edition
        id: freshness
        env:
          SCHEDULED_CHECK: ${{ inputs.scheduled_check }}
        run: python -m tools.daily_schedule
  update:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Restore Scholar query cache
        uses: actions/cache@v4
        with:
          path: data/cache/scholar
          key: scholar-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scholar-${{ runner.os }}-
      - name: Restore public WeChat index cache
        uses: actions/cache@v4
        with:
          path: data/cache/wechat-public
          key: wechat-public-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wechat-public-${{ runner.os }}-
      - name: Import local connector metadata
        shell: bash
        run: |
          if git fetch origin connector-data:refs/remotes/origin/connector-data; then
            for source in researchgate wechat wechat-status wechat-subscriptions; do
              path="data/inbox/${source}.json"
              if git cat-file -e "origin/connector-data:${path}" 2>/dev/null; then
                git show "origin/connector-data:${path}" > "$path"
              fi
            done
          fi
      - name: Run daily pipeline
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
          CNS_LOOKBACK_DAYS: 180
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ARXIV_CONTACT: ${{ secrets.ARXIV_CONTACT }}
          RESEARCHGATE_IMPORT_PATH: data/inbox/researchgate.json
          WECHAT_RSS_URLS: ${{ secrets.WECHAT_RSS_URLS }}
          WECHAT_RSS_HEADERS: ${{ secrets.WECHAT_RSS_HEADERS }}
          WECHAT_IMPORT_PATH: data/inbox/wechat.json
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: python -m src.pipeline
      - name: Update official research leads
        run: python -m src.research_leads
      - run: python tools/build_site.py
      - name: Publish GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Enterprise WeChat digest
        if: github.event_name == 'schedule' || inputs.scheduled_check || inputs.send_digest
        env:
          WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: python -m src.notify
      - name: Commit data archive
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data site
          git diff --cached --quiet || git commit -m "chore: update daily papers"
          git push
