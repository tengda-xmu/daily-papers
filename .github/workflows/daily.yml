name: Daily papers
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 07:00 Asia/Shanghai (UTC)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-papers-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Restore Scholar query cache
        uses: actions/cache@v4
        with:
          path: data/cache/scholar
          key: scholar-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scholar-${{ runner.os }}-
      - name: Restore public WeChat index cache
        uses: actions/cache@v4
        with:
          path: data/cache/wechat-public
          key: wechat-public-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wechat-public-${{ runner.os }}-
      - name: Import local connector metadata
        shell: bash
        run: |
          if git fetch origin connector-data:refs/remotes/origin/connector-data; then
            for source in researchgate wechat wechat-status wechat-subscriptions; do
              path="data/inbox/${source}.json"
              if git cat-file -e "origin/connector-data:${path}" 2>/dev/null; then
                git show "origin/connector-data:${path}" > "$path"
              fi
            done
          fi
      - name: Run daily pipeline
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
          ELSEVIER_QUERIES: ${{ secrets.ELSEVIER_QUERIES }}
          CNS_LOOKBACK_DAYS: 180
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCHOLAR_QUERIES: ${{ secrets.SCHOLAR_QUERIES }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ARXIV_CONTACT: ${{ secrets.ARXIV_CONTACT }}
          RESEARCHGATE_IMPORT_PATH: data/inbox/researchgate.json
          WECHAT_RSS_URLS: ${{ secrets.WECHAT_RSS_URLS }}
          WECHAT_RSS_HEADERS: ${{ secrets.WECHAT_RSS_HEADERS }}
          WECHAT_IMPORT_PATH: data/inbox/wechat.json
          MAX_CORE: 5
          MAX_EXTENDED: 5
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: python -m src.pipeline
      - run: python tools/build_site.py
      - name: Publish GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Enterprise WeChat digest
        env:
          WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: python -m src.notify
      - name: Commit data archive
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data site
          git diff --cached --quiet || git commit -m "chore: update daily papers"
          git push
